name: PR-Agent Automated Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  issue_comment:
    types:
      - created

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: read

    name: Run PR-Agent

    steps:
      - name: PR-Agent
        uses: the-pr-agent/pr-agent@main

        env:
          # GitHub authentication
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OpenRouter authentication
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Primary model
          config.model: "openrouter/openai/gpt-5"

          # Required because PR-Agent doesn't have this custom
          # model in its built-in MAX_TOKENS table
          config.custom_model_max_tokens: "16384"

          # Fallback model
          config.fallback_models: '["openrouter/anthropic/claude-sonnet-4"]'

          # Automatically review PRs
          github_action_config.auto_review: "true"

          # Review configuration
          pr_reviewer.require_tests_review: "true"
          pr_code_suggestions.num_code_suggestions: "5"

          # Reasoning
          openrouter.reasoning_effort: "medium"
