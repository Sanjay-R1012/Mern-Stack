name: PR-Agent Automated Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  issue_comment:
    types:
      - created

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}

    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write

    name: Run PR-Agent

    steps:
      - name: PR-Agent
        uses: the-pr-agent/pr-agent@main

        env:
          # --------------------------------------------------
          # GitHub
          # --------------------------------------------------
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --------------------------------------------------
          # OpenRouter
          # --------------------------------------------------
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # --------------------------------------------------
          # Model
          #
          # IMPORTANT:
          # Use the exact model ID available in OpenRouter.
          # Example:
          # openrouter/openai/gpt-5
          # --------------------------------------------------
          config.model: "openrouter/openai/gpt-5"
          config.fallback_models: '["openrouter/anthropic/claude-sonnet-4"]'

          # --------------------------------------------------
          # OpenRouter settings
          # --------------------------------------------------
          openrouter.reasoning_effort: "medium"

          # --------------------------------------------------
          # Automatic PR actions
          # --------------------------------------------------
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          # Run review automatically for these events
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'

          # --------------------------------------------------
          # Review configuration
          # --------------------------------------------------
          pr_reviewer.require_tests_review: "true"

          # --------------------------------------------------
          # Code suggestions
          # --------------------------------------------------
          pr_code_suggestions.num_code_suggestions: "5"

          # --------------------------------------------------
          # Timeout
          # --------------------------------------------------
          config.ai_timeout: "300"
